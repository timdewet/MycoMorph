[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycomorph"
version = "0.3.0"
description = "MycoMorph: bacterial microscopy pre-processing pipeline with PyQt6 GUI (focus picking, FOV split, Cellpose-SAM segmentation, cell-quality classification)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "scikit-learn",
    "tifffile>=2024.1.30",
    "czifile",
    "pylibCZIrw>=4.1",
    "matplotlib>=3.7",
    "typer>=0.12",
    "cellpose",
    "torch",
    "torchvision",
    "pandas",
    "pyarrow",
    "h5py",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "qtawesome>=1.3",
    "umap-learn>=0.5",
    "plotly>=5.20",
    "PyQt6-WebEngine>=6.5",
]

[project.optional-dependencies]
napari = ["napari"]
profiling = [
    # Pin upper bound: versions after 0.0.9 require a C++ toolchain to
    # build from source on Windows (scikit-build-core + CMake). 0.0.9 is
    # pure-Python and installs from PyPI as a wheel everywhere.
    "harmonypy>=0.0.9,<0.0.10",
]
# Optional dependencies for the Fluorescent Normalisation and Foci Detection
# pipeline stages. Each heavy detector / normaliser lazy-imports its package,
# so installing only the subset you need (e.g. just ``bm3d``) works too.
foci = [
    "bm3d",                                          # BM3D denoising
    "trackpy",                                       # radial-symmetry detector
    "basicpy",                                       # BaSiC flat-field correction
]
test = [
    "pytest>=8",
    "pytest-qt>=4",
    "ruff>=0.12",
    "mypy>=1.16",
]

[project.scripts]
mycomorph = "mycomorph.gui.app:main"
mycomorph-cli = "mycomorph.core.cli:app"
mycomorph-focus = "mycomorph.core.focus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mycomorph.core" = ["models/*.pth"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with correctness checks that are suitable for the existing codebase;
# broader style rules can be adopted module-by-module during refactors.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
