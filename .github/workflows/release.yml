name: Release

# Driven by release-please. Conventional commits on `main` (`feat:`,
# `fix:`, `BREAKING CHANGE:`) accumulate into a single open "release"
# PR that bumps src/mycomorph/__init__.py + pyproject.toml. Merging that
# PR cuts a new GitHub Release; this workflow then builds the Windows
# PyInstaller bundle and the macOS app (Apple silicon) and uploads them to
# the release. Both bundles also open ModelPrep (`--modelprep`).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/release-py312.txt -e . pyinstaller==6.16.0

      - name: Verify tag matches package __version__
        shell: pwsh
        run: |
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          # release-please uses component tags such as mycomorph-v0.3.0.
          # Accept both that form and a conventional v0.3.0 tag.
          $tagVersion = $tag -replace '^mycomorph-v', '' -replace '^v', ''
          $pkgVersion = (python -c "import mycomorph; print(mycomorph.__version__)").Trim()
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag '$tag' (=> '$tagVersion') does not match mycomorph.__version__ ('$pkgVersion')."
            exit 1
          }
          Write-Host "Tag $tag matches package version $pkgVersion"

      - name: Build PyInstaller bundle
        run: pyinstaller packaging/mycomorph.spec

      - name: Zip bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MycoMorph/*" -DestinationPath "dist/MycoMorph-windows.zip" -Force

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/MycoMorph-windows.zip --clobber

  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/release-py312.txt -e . pyinstaller==6.16.0

      - name: Verify tag matches package __version__
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          tag_version="${tag#mycomorph-v}"
          tag_version="${tag_version#v}"
          pkg_version="$(python -c 'import mycomorph; print(mycomorph.__version__)')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag '$tag' (=> '$tag_version') does not match mycomorph.__version__ ('$pkg_version')."
            exit 1
          fi
          echo "Tag $tag matches package version $pkg_version"

      - name: Build macOS app
        run: pyinstaller packaging/mycomorph.spec

      - name: Zip app
        # ditto keeps the bundle's symlinks and extended attributes.
        run: ditto -c -k --sequesterRsrc --keepParent dist/MycoMorph.app dist/MycoMorph-macos.zip

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/MycoMorph-macos.zip --clobber
